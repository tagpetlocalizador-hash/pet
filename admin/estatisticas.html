<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pet NFC - Estatísticas</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

.card-stat{

border:none;
border-radius:18px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

transition:.25s;

}

.card-stat:hover{

transform:translateY(-3px);

}

.numero{

font-size:42px;
font-weight:bold;

margin-top:10px;

}

.icone{

font-size:34px;

opacity:.8;

}

.card-info{

border:none;

border-radius:18px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

height:100%;

}

#graficoStatus{

max-height:350px;

}

</style>

</head>

<body>

<div class="wrapper">

<!-- Sidebar -->

<div id="sidebar"></div>

<!-- Conteúdo -->

<div class="content p-4">

<div class="mb-4">

    <h2 class="mb-0 d-flex align-items-center gap-2">

        <i class="bi bi-bar-chart-fill text-primary"></i>

        <span>Estatísticas</span>

    </h2>

</div>

<!-- Cards -->

<div class="row g-4 mb-4">

<div class="col-md-3">

<div class="card card-stat text-center">

<div class="card-body">

<div class="icone text-primary">

<i class="bi bi-upc-scan"></i>

</div>

<div
id="totalTags"
class="numero text-primary">

0

</div>

<div>

Total de TAGs

</div>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card card-stat text-center">

<div class="card-body">

<div class="icone text-success">

<i class="bi bi-heart-fill"></i>

</div>

<div
id="petsAtivos"
class="numero text-success">

0

</div>

<div>

Pets Ativos

</div>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card card-stat text-center">

<div class="card-body">

<div class="icone text-secondary">

<i class="bi bi-tag-fill"></i>

</div>

<div
id="tagsLivres"
class="numero text-secondary">

0

</div>

<div>

TAGs Livres

</div>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card card-stat text-center">

<div class="card-body">

<div class="icone text-danger">

<i class="bi bi-lock-fill"></i>

</div>

<div
id="petsBloqueados"
class="numero text-danger">

0

</div>

<div>

Bloqueados

</div>

</div>

</div>

</div>

</div>

<!-- Informações -->

<div class="row g-4 mb-4">

<div class="col-lg-6">

<div class="card card-info">

<div class="card-header">

Último Pet Cadastrado

</div>

<div class="card-body">

<h5 id="ultimoNome">

-

</h5>

<p>

Tutor:

<strong
id="ultimoTutor">

-

</strong>

</p>

<p>

Data:

<strong
id="ultimaData">

-

</strong>

</p>

</div>

</div>

</div>

<div class="col-lg-6">

<div class="card card-info">

<div class="card-header">

Última Localização

</div>

<div class="card-body">

<h5
id="petLocalizacao">

-

</h5>

<p>

Data:

<strong
id="dataLocalizacao">

-

</strong>

</p>

<a

id="btnMaps"

href="#"

target="_blank"

class="btn btn-primary btn-sm disabled">

<i class="bi bi-geo-alt-fill"></i>

Abrir no Maps

</a>

</div>

</div>

</div>

</div>

<!-- Gráfico -->

<div class="card card-info">

<div class="card-header">

Situação Geral

</div>

<div class="card-body">

<canvas id="graficoStatus"></canvas>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/estatisticas.js"></script>

</body>

</html>
