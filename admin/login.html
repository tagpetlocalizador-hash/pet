<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PET NFC Admin - Login</title>

<meta name="theme-color" content="#0d6efd">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

<link href="css/style.css" rel="stylesheet">

<style>

body{

background:#f5f7fb;

display:flex;

align-items:center;

justify-content:center;

min-height:100vh;

}

.login-card{

width:100%;

max-width:420px;

border:none;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.10);

overflow:hidden;

}

.login-topo{

background:#0d6efd;

color:#fff;

padding:35px;

text-align:center;

}

.login-topo i{

font-size:60px;

margin-bottom:15px;

}

.login-body{

padding:35px;

}

.form-control{

height:50px;

border-radius:12px;

}

.btn-primary{

height:50px;

border-radius:12px;

font-weight:bold;

}

#mensagem{

display:none;

}

</style>

</head>

<body>

<div class="card login-card">

<div class="login-topo">

<i class="bi bi-shield-lock-fill"></i>

<h3 class="mb-1">

PET NFC

</h3>

<p class="mb-0">

Painel Administrativo

</p>

</div>

<div class="login-body">

<div
id="mensagem"
class="alert alert-danger">
</div>

<div class="mb-3">

<label class="form-label">

E-mail

</label>

<input
id="email"
type="email"
class="form-control">

</div>

<div class="mb-4">

<label class="form-label">

Senha

</label>

<input
id="senha"
type="password"
class="form-control">

</div>

<button
id="btnEntrar"
class="btn btn-primary w-100">

<i class="bi bi-box-arrow-in-right"></i>

Entrar

</button>

</div>

</div>

<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/login.js"></script>

</body>
</html>
