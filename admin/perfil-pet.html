<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PET NFC Admin - Perfil do Pet</title>

<meta name="theme-color" content="#0d6efd">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
rel="stylesheet">

<link href="css/style.css" rel="stylesheet">

<style>

.card-perfil{

border:0;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.foto-pet{

width:220px;
height:220px;

border-radius:50%;

border:6px solid #0d6efd;

object-fit:cover;

background:#f5f5f5;

}

.info{

font-size:.88rem;
color:#6c757d;
margin-bottom:4px;

}

.titulo-card{

font-size:1.1rem;
font-weight:bold;

margin-bottom:20px;

}

</style>

</head>

<body>

<div class="d-flex">

<!-- MENU -->

<aside class="sidebar">

<div class="text-center py-4">

<h3 class="fw-bold text-white">

PET NFC

</h3>

<small class="text-light">

Painel Administrativo

</small>

</div>

<hr>

<a href="index.html" class="menu-item">

<i class="bi bi-speedometer2"></i>

Dashboard

</a>

<a href="tags.html" class="menu-item">

<i class="bi bi-upc-scan"></i>

TAGs

</a>

<a href="pets.html" class="menu-item active">

<i class="bi bi-heart-fill"></i>

Pets

</a>

<a href="estatisticas.html" class="menu-item">

<i class="bi bi-bar-chart-fill"></i>

Estatísticas

</a>

<a href="configuracoes.html" class="menu-item">

<i class="bi bi-gear-fill"></i>

Configurações

</a>

</aside>

<!-- CONTEÚDO -->

<main class="content container-fluid p-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<div>

<h2 class="mb-1">

Perfil do Pet

</h2>

<p class="text-muted mb-0">

Editar informações do pet

</p>

</div>

<a
href="pets.html"
class="btn btn-outline-primary">

<i class="bi bi-arrow-left"></i>

Voltar

</a>

</div>

<div class="row g-4">

<!-- FOTO -->

<div class="col-lg-4">

<div class="card card-perfil">

<div class="card-body text-center">

<img

id="fotoPet"

class="foto-pet"

src="https://placehold.co/300x300?text=PET"

alt="Foto do Pet">

<h3

id="tituloPet"

class="mt-4">

Carregando...

</h3>

<div

id="codigoTag"

class="text-muted">

TAG

</div>

<button

id="btnTrocarFoto"

class="btn btn-primary mt-4">

<i class="bi bi-camera-fill"></i>

Trocar Foto

</button>

<input

type="file"

id="arquivoFoto"

accept="image/*"

hidden>

</div>

</div>

</div>

<!-- FORMULÁRIO -->

<div class="col-lg-8">

<div class="card card-perfil">

<div class="card-body">

<div class="titulo-card">

🐾 Dados do Pet

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Nome do Pet

</label>

<input

id="nomePet"

type="text"

class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Tutor

</label>

<input

id="nomeTutor"

type="text"

class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

WhatsApp

</label>

<input

id="whatsapp"

type="text"

class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

E-mail

</label>

<input

id="email"

type="email"

class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Status

</label>

<select

id="status"

class="form-select">

<option value="ATIVO">

ATIVO

</option>

<option value="BLOQUEADO">

BLOQUEADO

</option>

<option value="LIVRE">

LIVRE

</option>

</select>

</div>
<div class="col-md-6 mb-3">

<label class="form-label">

Token

</label>

<input

id="token"

type="text"

class="form-control"

readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Código de Ativação

</label>

<input

id="codigoAtivacao"

type="text"

class="form-control"

readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Data de Cadastro

</label>

<input

id="dataCadastro"

type="text"

class="form-control"

readonly>

</div>

<div class="col-md-12">

<hr>

<div class="titulo-card">

📍 Última Localização

</div>

<textarea

id="ultimaLocalizacao"

class="form-control"

rows="3"

readonly>

</textarea>

<a

id="btnMaps"

href="#"

target="_blank"

class="btn btn-success mt-3">

<i class="bi bi-geo-alt-fill"></i>

Abrir no Google Maps

</a>

</div>

</div>

</div>

</div>

</div>

</div>

<div class="row mt-4">

<div class="col-12">

<div class="card card-perfil">

<div class="card-body">

<div class="d-flex justify-content-end gap-2">

<a

href="pets.html"

class="btn btn-secondary">

Cancelar

</a>

<button

id="btnSalvar"

class="btn btn-primary">

<i class="bi bi-floppy-fill"></i>

Salvar Alterações

</button>

</div>

</div>

</div>

</div>

</div>

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/perfil-pet.js"></script>

</body>

</html>
